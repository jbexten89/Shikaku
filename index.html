<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shikaku">
<meta name="theme-color" content="#07080A">
<title>Shikaku</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080A;--panel:#111317;--panel2:#171A1F;--border:#23272E;--border2:#2E333B;
  --text:#E6E8EB;--muted:#8A9099;--mint:#3CC79A;--amber:#E3A04F;
  --line:rgba(255,255,255,.07);--cell:40px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Nunito Sans',Avenir,'Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{min-height:100dvh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{max-width:640px;margin:0 auto;padding:12px 16px 14px;display:flex;flex-direction:column;gap:12px;
  min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:260px;position:relative}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.3px}
.brand h1 span{color:var(--mint)}
.brand .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.iconbtns{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;font-weight:800;font-size:17px}
.iconbtn:active{background:var(--panel2)}
.iconbtn svg{width:19px;height:19px}

.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4px}
.modes button{background:none;border:0;border-radius:10px;padding:7px 2px 6px;line-height:1.1;color:var(--muted)}
.modes button b{display:block;font-size:13.5px;font-weight:800}
.modes button small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.modes button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.modes button.on small{color:var(--mint);opacity:1}

.stats{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px 0}
.stat{flex:1;text-align:center;border-left:1px solid var(--border)}
.stat:first-child{border-left:0}
.timebtn{background:none;border:0;border-radius:0;padding:0;font:inherit;color:inherit}
.timebtn .pz{width:10px;height:10px;vertical-align:-1px;margin-left:3px;opacity:.85;color:var(--mint)}
.timebtn:active .v{opacity:.6}
.pauseOv{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);z-index:8}
.pauseOv .pk{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.pauseOv .pt{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:14px}
.pauseOv .btn{flex:none;min-width:180px}
body.paused .pauseOv{display:flex}
body.paused .boardWrap{visibility:hidden}
body.paused .controls .ctl:not(#newBtn){opacity:.35;pointer-events:none}
.tile.lit.neu{background:#2C3341}
.preview.neu{box-shadow:inset 0 0 0 2px #A3ABB8}
.dim.neu{background:#C9CED6;color:#0B0D10}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px;width:100%;text-align:left}
.setrow b{font-size:16px;font-weight:800;display:block}
.setrow small{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35;display:block}
.tog{flex-shrink:0;width:50px;height:30px;border-radius:999px;background:#2E333B;position:relative;transition:background .15s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#E6E8EB;transition:transform .15s}
.tog.on{background:var(--mint)}
.tog.on::after{transform:translateX(20px)}
.sechd{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;margin:16px 0 -2px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700}
.stat .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v.mint{color:var(--mint)}

.banner{background:var(--amber);color:#1A1205;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;display:none}
.banner.show{display:block}

.boardWrap{position:relative;align-self:center;aspect-ratio:1;
  width:min(100%,600px,max(260px,calc(100dvh - 380px - env(safe-area-inset-top) - env(safe-area-inset-bottom))))}
.board{position:absolute;inset:0;touch-action:none;cursor:crosshair;--n:5;--hg:2px;--rad:8px}
.board.solved{cursor:default}
.tile{position:absolute;border-radius:var(--rad);background:#181B21;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:background .12s,transform .12s}
.tile.lit{background:#5A4424;transform:scale(1.04)}
.tile.lit.ok{background:#1F6A51}
.rect{transition:opacity .12s}
.rect.doomed{opacity:.28}
.layer{position:absolute;inset:0;pointer-events:none}
.rect{position:absolute;border-radius:var(--rad);background:var(--bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.35)}
.rect::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s;
  box-shadow:0 0 max(4px,calc(var(--cell)*.1)) var(--bg),0 0 max(11px,calc(var(--cell)*.28)) var(--bg),0 0 max(22px,calc(var(--cell)*.6)) color-mix(in srgb,var(--bg) 55%,transparent)}
.board.neon .rect:not(.bad){box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bg) 35%,#fff),inset 0 0 calc(var(--cell)*.22) color-mix(in srgb,var(--bg) 60%,#fff)}
.board.neon .rect:not(.bad)::before{opacity:1}
.board.neon.solved .rect::before{animation:neonpulse 2.6s ease-in-out 1s infinite}
@keyframes neonpulse{0%,100%{opacity:1}50%{opacity:.45}}
.rect.bad{background:#2A2D33;box-shadow:inset 0 0 0 2.5px var(--amber)}
.rect.hint::after{content:'';position:absolute;top:calc(var(--cell)*.12);right:calc(var(--cell)*.12);width:calc(var(--cell)*.13);height:calc(var(--cell)*.13);border-radius:50%;background:var(--fg);opacity:.45}
.rect.pop{animation:snap .28s cubic-bezier(.3,1.7,.5,1)}
@keyframes snap{from{transform:scale(.9)}to{transform:scale(1)}}
.rect.wave{animation:wave .55s ease-out both;animation-delay:var(--d)}
@keyframes wave{0%{transform:scale(1)}40%{transform:scale(1.06);filter:brightness(1.18)}100%{transform:scale(1)}}
.clue{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:650;
  font-size:calc(var(--cell) * .48);font-variant-numeric:tabular-nums;color:#D9DCE1;transition:color .15s}
.clue.bad{color:var(--amber)}
.preview{position:absolute;border-radius:var(--rad);background:transparent;box-shadow:inset 0 0 0 2px var(--amber);display:none}
.preview.ok{box-shadow:inset 0 0 0 2px var(--mint)}
.dim{position:absolute;z-index:5;pointer-events:none;display:none;background:var(--amber);color:#1A1205;font-weight:900;
  font-size:15px;padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.dim.ok{background:var(--mint);color:#04160F}
.loupe{position:absolute;z-index:9;width:128px;height:128px;border-radius:50%;overflow:hidden;pointer-events:none;display:none;
  background:var(--bg);box-shadow:0 0 0 2px #3A404A,0 10px 28px rgba(0,0,0,.6)}
.loupe .board{cursor:default}
.loupe .lc{position:absolute;border-radius:6px;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(0,0,0,.45)}
.loupe .lbl{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);background:var(--amber);color:#1A1205;font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.loupe .lbl.ok{background:var(--mint);color:#04160F}
.loupe .lbl.neu{background:#C9CED6;color:#0B0D10}

.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-top:4px}
.ctl{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px 2px 13px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
.ctl svg{width:27px;height:27px}
.ctl span{font-size:13px;font-weight:700;color:var(--muted)}
.ctl:active{transform:scale(.95)}
.ctl:active{background:var(--panel2)}
.ctl:disabled{opacity:.35}
.ctl.primary{border-color:rgba(60,199,154,.45)}
.ctl.primary svg{color:var(--mint)}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:50;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.backdrop.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:420px;max-height:100%;overflow:auto;padding:22px 20px 18px;
  animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 4px;font-size:22px;font-weight:900}
.modal p,.modal li{color:#C4C8CE;font-size:15px;line-height:1.5}
.modal ul{padding-left:20px;margin:8px 0}
.modal .muted{color:var(--muted);font-size:13px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border-radius:14px;padding:13px;font-size:16px;font-weight:800;border:1px solid var(--border2);background:var(--panel2)}
.btn.mint{background:var(--mint);color:#04160F;border-color:var(--mint)}
.btn.amber{background:var(--amber);color:#1A1205;border-color:var(--amber)}
.big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mint);line-height:1.05;margin:10px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mini{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.mini .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.mini .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--amber);color:#1A1205;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:right;font-weight:700;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-top:1px solid var(--border);text-align:right;font-weight:700;font-size:15px}
td:first-child{font-weight:700;color:#C4C8CE}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--border2);border-top-color:var(--mint);animation:spin .8s linear infinite;margin:6px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.palopt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px;text-align:left}
.palopt b{font-size:16px;font-weight:800;display:block}
.palopt small{font-size:12.5px;color:var(--muted);font-weight:600}
.palopt.on{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}
.sw{display:flex;gap:4px;flex-shrink:0}
.sw i{width:17px;height:17px;border-radius:5px;display:block}
.ex{display:block;margin:10px auto 4px;width:150px;height:150px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Shikaku<span>.</span></h1><div class="sub" id="sub">Divide the grid into rectangles</div></div>
    <div class="iconbtns">
      <button class="iconbtn" id="palBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="iconbtn" id="statsBtn" aria-label="Stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-6"/></svg></button>
      <button class="iconbtn" id="helpBtn" aria-label="How to play">?</button>
    </div>
  </header>

  <div class="modes" id="modes"></div>

  <div class="stats">
    <button class="stat timebtn" id="timeBtn" aria-label="Pause"><div class="k">Time <svg class="pz" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></div><div class="v" id="time">0:00</div></button>
    <div class="stat"><div class="k">Filled</div><div class="v" id="prog">0%</div></div>
    <div class="stat"><div class="k">Hints</div><div class="v" id="hints">0</div></div>
  </div>

  <div class="banner" id="banner"></div>
  <div class="stage" id="stage">

  <div class="boardWrap" id="wrap">
    <div class="board" id="board">
      <div class="layer" id="tileLayer" style="z-index:0"></div>
      <div class="layer" id="rectLayer" style="z-index:1"></div>
      <div class="layer" style="z-index:2"><div class="preview" id="preview"></div></div>
      <div class="layer" id="clueLayer" style="z-index:3"></div>
    </div>
    <div class="dim" id="dim"></div>
    <div class="loupe" id="loupe"><div id="loupeIn"></div><div class="lc" id="loupeC"></div><div class="lbl" id="loupeL"></div></div>
  </div>
  <div class="pauseOv" id="pauseOv"><div class="pk">Paused</div><div class="pt" id="pauseTime">0:00</div><button class="btn mint" id="resumeBtn">Resume</button></div>
  </div>

  <div class="controls">
    <button class="ctl" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
    <button class="ctl" id="redoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>Redo</span></button>
    <button class="ctl" id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg><span>Hint</span></button>
    <button class="ctl" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Reset</span></button>
    <button class="ctl primary" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>

<script>
'use strict';
// ===== GEN-START =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

const MODES={
  easy:  {label:'Easy',  size:5, maxArea:6, strip:4},
  medium:{label:'Medium',size:7, maxArea:9, strip:5},
  hard:  {label:'Hard',  size:10,maxArea:12,strip:5},
  expert:{label:'Expert',size:12,maxArea:16,strip:6},
  daily: {label:'Daily', size:8, maxArea:10,strip:5}
};

// Randomly partition an N×N grid into rectangles (row-major, top-left anchored).
function partition(N,rng,cfg){
  const owner=new Int16Array(N*N).fill(-1),rects=[];
  for(let idx=0;idx<N*N;idx++){
    if(owner[idx]>=0)continue;
    const r=(idx/N)|0,c=idx%N,opts=[];let tot=0,curW=N-c;
    for(let h=1;r+h-1<N;h++){
      const rr=r+h-1;let run=0;
      while(run<curW&&owner[rr*N+c+run]<0)run++;
      curW=run;if(curW===0)break;
      for(let w=1;w<=curW;w++){
        const a=w*h;if(a>cfg.maxArea)break;
        const mn=Math.min(w,h),mx=Math.max(w,h);
        if(mn===1&&mx>cfg.strip)continue;
        if(mn>1&&mx>mn*3)continue;
        const wt=a===1?0.06:1;
        opts.push([w,h,wt]);tot+=wt;
      }
      if(h>=cfg.maxArea)break;
    }
    let x=rng()*tot,ch=opts[opts.length-1];
    for(const o of opts){x-=o[2];if(x<=0){ch=o;break}}
    const w=ch[0],h=ch[1],id=rects.length;
    for(let i=0;i<h;i++)for(let j=0;j<w;j++)owner[(r+i)*N+c+j]=id;
    rects.push({r,c,w,h});
  }
  return rects;
}

// Every rectangle each clue could legally occupy (any shape, not just generator shapes).
function buildCands(N,clues){
  const clueAt=new Int16Array(N*N).fill(-1);clues.forEach((k,i)=>clueAt[k.r*N+k.c]=i);
  const cands=[],cellC=Array.from({length:N*N},()=>[]);
  clues.forEach((k,ci)=>{
    for(let w=1;w<=k.n;w++){
      if(k.n%w)continue;const h=k.n/w;if(w>N||h>N)continue;
      for(let r0=Math.max(0,k.r-h+1);r0<=k.r&&r0+h<=N;r0++)
        for(let c0=Math.max(0,k.c-w+1);c0<=k.c&&c0+w<=N;c0++){
          const cells=[];let ok=true;
          for(let i=0;i<h&&ok;i++)for(let j=0;j<w;j++){
            const id=(r0+i)*N+c0+j;
            if(clueAt[id]>=0&&clueAt[id]!==ci){ok=false;break}
            cells.push(id);
          }
          if(!ok)continue;
          const cid=cands.length;cands.push({clue:ci,r:r0,c:c0,w,h,cells});
          for(const id of cells)cellC[id].push(cid);
        }
    }
  });
  return{cands,cellC};
}

// Exact-cover backtracking; stops once `limit` solutions are found.
function countSolutions(N,clues,limit,nodeLimit){
  limit=limit||2;nodeLimit=nodeLimit||150000;
  const{cands,cellC}=buildCands(N,clues);
  const cov=new Uint8Array(N*N),used=new Uint8Array(clues.length);
  let count=0,nodes=0,aborted=false;
  const valid=cid=>{const k=cands[cid];if(used[k.clue])return false;for(const id of k.cells)if(cov[id])return false;return true};
  (function rec(){
    if(++nodes>nodeLimit){aborted=true;return}
    let best=-1,bestN=1e9;
    for(let i=0;i<N*N;i++){
      if(cov[i])continue;let n=0;
      for(const cid of cellC[i])if(valid(cid)){n++;if(n>=bestN)break}
      if(n===0)return;
      if(n<bestN){bestN=n;best=i;if(n===1)break}
    }
    if(best<0){count++;return}
    for(const cid of cellC[best]){
      if(!valid(cid))continue;const k=cands[cid];
      used[k.clue]=1;for(const id of k.cells)cov[id]=1;
      rec();
      for(const id of k.cells)cov[id]=0;used[k.clue]=0;
      if(count>=limit||aborted)return;
    }
  })();
  return aborted?limit:count;
}

function generate(mode,rng){
  const cfg=MODES[mode],N=cfg.size,maxOnes=Math.ceil(N*N/40);
  for(let attempt=0;attempt<100000;attempt++){
    const rects=partition(N,rng,cfg);
    if(rects.filter(q=>q.w*q.h===1).length>maxOnes)continue;
    for(let p=0;p<8;p++){
      const clues=rects.map(q=>{const a=Math.floor(rng()*q.w*q.h);return{r:q.r+Math.floor(a/q.w),c:q.c+a%q.w,n:q.w*q.h}});
      if(countSolutions(N,clues,2)===1)
        return{size:N,clues,solution:rects.map(q=>({r:q.r,c:q.c,w:q.w,h:q.h}))};
    }
  }
  return null;
}
// Human-style solver. Returns {solved, maxLevel, counts}
// L1: clue has a single fitting rectangle / cell reachable by single rectangle
// L2: overlap — cells shared by all of a clue's rectangles are claimed (removes others)
// L3: contradiction — trying a rectangle leads to an immediate L1/L2 dead end
function rate(N,clues,maxL){
  maxL=maxL||3;
  const {cands,cellC}=buildCands(N,clues);
  const C=cands.length;
  function run(alive,cov,placed,level){ // mutates; returns {ok, stuck, counts}
    const counts=[0,0,0,0];
    const kill=cid=>{alive[cid]=0};
    const place=cid=>{const k=cands[cid];placed[k.clue]=1;
      for(const id of k.cells){cov[id]=1;for(const o of cellC[id])if(o!==cid)alive[o]=0}
      for(let o=0;o<C;o++)if(alive[o]&&cands[o].clue===k.clue&&o!==cid)alive[o]=0;};
    for(;;){
      let prog=false;
      // L1a clue single
      const byClue=clues.map(()=>[]);
      for(let i=0;i<C;i++)if(alive[i]&&!placed[cands[i].clue])byClue[cands[i].clue].push(i);
      for(let ci=0;ci<clues.length;ci++){if(placed[ci])continue;
        if(byClue[ci].length===0)return{ok:false};
        if(byClue[ci].length===1){place(byClue[ci][0]);counts[1]++;prog=true}}
      if(prog)continue;
      // L1b cell single
      for(let id=0;id<N*N;id++){if(cov[id])continue;let n=0,last=-1;
        for(const o of cellC[id])if(alive[o]){n++;last=o;if(n>1)break}
        if(n===0)return{ok:false};
        if(n===1){place(last);counts[1]++;prog=true;break}}
      if(prog)continue;
      if(placed.every(x=>x))return{ok:true,done:true,counts};
      if(level<2)return{ok:true,done:false,counts};
      // L2 overlap
      for(let ci=0;ci<clues.length;ci++){if(placed[ci])continue;
        const cnt=new Map();for(const o of byClue[ci])for(const id of cands[o].cells)cnt.set(id,(cnt.get(id)||0)+1);
        for(const [id,v] of cnt)if(v===byClue[ci].length)for(const o of cellC[id])if(alive[o]&&cands[o].clue!==ci){alive[o]=0;prog=true}
        if(prog){counts[2]++;break}}
      if(prog)continue;
      if(level<3)return{ok:true,done:false,counts};
      // L3 contradiction: try each alive cand of most constrained clues
      let found=false;
      const order=[...Array(clues.length).keys()].filter(c=>!placed[c]).sort((a,b)=>byClue[a].length-byClue[b].length);
      outer:for(const ci of order)for(const o of byClue[ci]){
        const a2=alive.slice(),c2=cov.slice(),p2=placed.slice();
        const k=cands[o];p2[k.clue]=1;for(const id of k.cells){c2[id]=1;for(const x of cellC[id])if(x!==o)a2[x]=0}
        for(const x of byClue[ci])if(x!==o)a2[x]=0;
        const r=run(a2,c2,p2,2);
        if(!r.ok){alive[o]=0;counts[3]++;found=true;break outer}
      }
      if(found)continue;
      return{ok:true,done:false,counts};
    }
  }
  const alive=new Uint8Array(C).fill(1),cov=new Uint8Array(N*N),placed=new Array(clues.length).fill(0);
  const r=run(alive,cov,placed,maxL);
  const lvl=!r.done?4:r.counts[3]?3:r.counts[2]?2:1;
  return{level:lvl,counts:r.counts};
}
const TARGET={easy:s=>s.level===1,medium:s=>s.level===2,hard:s=>s.level===3||(s.level===2&&s.counts[2]>=4),
  expert:s=>s.level===3&&s.counts[3]>=2,daily:s=>s.level>=2};
const scoreOf=s=>s.level*100+s.counts[2]*2+s.counts[3]*10;
function generateRated(mode,rng){
  let best=null,bestS=-1;
  for(let t=0;t<600;t++){
    const p=generate(mode,rng);if(!p)continue;
    const r=rate(p.size,p.clues);p.rating={level:r.level,counts:r.counts};
    if(TARGET[mode](r))return p;
    const sc=mode==='easy'?-scoreOf(r):scoreOf(r);
    if(sc>bestS){bestS=sc;best=p}
  }
  return best;
}

/* ---------- board ---------- */
function pct(v,N){return (v/N*100).toFixed(4)+'%'}
function boxStyle(r,c,w,h,N){
  return `left:calc(${pct(c,N)} + var(--hg));top:calc(${pct(r,N)} + var(--hg));`+
         `width:calc(${pct(w,N)} - var(--hg) * 2);height:calc(${pct(h,N)} - var(--hg) * 2)`;
}

function buildBoard(){
  const N=G.puzzle.size;

  let t='';for(let r=0;r<N;r++)for(let c=0;c<N;c++)t+=`<div class="tile" style="${boxStyle(r,c,1,1,N)}"></div>`;
  $('tileLayer').innerHTML=t;
  clueLayer.innerHTML=G.puzzle.clues.map((k,i)=>`<div class="clue" id="clue${i}" style="${boxStyle(k.r,k.c,1,1,N,0)}">${k.n}</div>`).join('');
  sizeCells();

}

function analyze(){
  const N=G.puzzle.size,owner=new Int16Array(N*N).fill(-1),clueAt=new Int16Array(N*N).fill(-1);
  G.rects.forEach((q,i)=>{for(let a=0;a<q.h;a++)for(let b=0;b<q.w;b++)owner[(q.r+a)*N+q.c+b]=i});
  G.puzzle.clues.forEach((k,i)=>clueAt[k.r*N+k.c]=i);
  const valid=G.rects.map(q=>{
    let cnt=0,n=0;
    for(let a=0;a<q.h;a++)for(let b=0;b<q.w;b++){const ci=clueAt[(q.r+a)*N+q.c+b];if(ci>=0){cnt++;n=G.puzzle.clues[ci].n}}
    return cnt===1&&n===q.w*q.h;
  });
  let covered=0;for(let i=0;i<N*N;i++)if(owner[i]>=0)covered++;
  return{N,owner,clueAt,valid,covered};
}

function render(){
  A=analyze();const{N,owner,valid,covered}=A;

  }).join('');

/* ---------- edits ---------- */
const snap=()=>JSON.stringify(G.rects);
function commit(){undoStack.push(snap());if(undoStack.length>300)undoStack.shift();redoStack=[]}

function pickColor(q){
  const{N,owner}=A,near=new Set();
  const look=(r,c)=>{if(r<0||c<0||r>=N||c>=N)return;const o=owner[r*N+c];if(o>=0&&!overlaps(G.rects[o],q))near.add(G.rects[o].col%PAL.length)};
  for(let i=0;i<q.w;i++){look(q.r-1,q.c+i);look(q.r+q.h,q.c+i)}
  for(let i=0;i<q.h;i++){look(q.r+i,q.c-1);look(q.r+i,q.c+q.w)}
  const hd=(a,b)=>{const d=Math.abs(hueOf(PAL[a][0])-hueOf(PAL[b][0]))%360;return Math.min(d,360-d)};
  let best=G.colorSeq%PAL.length,bestD=-1;
  for(let t=0;t<PAL.length;t++){
    const c=(G.colorSeq+t)%PAL.length;let m=360;
    for(const n of near)m=Math.min(m,hd(c,n));
    if(m>=40){best=c;break}
    if(m>bestD){bestD=m;best=c}
  }
  G.colorSeq=best+1;return best;
}
const overlaps=(a,b)=>a.r<b.r+b.h&&b.r<a.r+a.h&&a.c<b.c+b.w&&b.c<a.c+a.w;

function placeRect(q,hint){
  commit();
  q.col=pickColor(q);if(hint)q.hint=true;
  G.rects=G.rects.filter(o=>!overlaps(o,q));
  G.rects.push(q);popKey=`${q.r},${q.c},${q.w},${q.h}`;
  render();saveGame();
  if(!G.solved&&A.valid[A.valid.length-1])buzz(8);
}
function removeRect(i){commit();G.rects.splice(i,1);render();saveGame()}

$('undoBtn').onclick=()=>{if(!undoStack.length||G.solved)return;redoStack.push(snap());G.rects=JSON.parse(undoStack.pop());render();saveGame()};

  const wrong=missing.filter(s=>G.rects.some(q=>overlaps(q,s)));

/* ---------- pointer input ---------- */
function cellAt(e,prev){
  const b=board.getBoundingClientRect(),N=G.puzzle.size;
  const fx=(e.clientX-b.left)/b.width*N,fy=(e.clientY-b.top)/b.height*N;
  const clamp=v=>Math.min(N-1,Math.max(0,Math.floor(v)));
  let r=clamp(fy),c=clamp(fx);
  // stickiness: near the edge between two neighboring squares, keep the current one
  const STICK=N>=10?.28:.18;
  if(prev){
    if(Math.abs(c-prev.c)===1&&Math.abs(fx-Math.max(c,prev.c))<STICK)c=prev.c;
    if(Math.abs(r-prev.r)===1&&Math.abs(fy-Math.max(r,prev.r))<STICK)r=prev.r;
  }
  return{r,c};
}
function dragRect(){
  const s=drag.s,e=drag.cur;
  return{r:Math.min(s.r,e.r),c:Math.min(s.c,e.c),w:Math.abs(s.c-e.c)+1,h:Math.abs(s.r-e.r)+1};
}
function showPreview(){
  const q=dragRect(),N=G.puzzle.size,area=q.w*q.h;
  let cnt=0,n=0;
  for(let a=0;a<q.h;a++)for(let b=0;b<q.w;b++){const ci=A.clueAt[(q.r+a)*N+q.c+b];if(ci>=0){cnt++;n=G.puzzle.clues[ci].n}}
  const ok=cnt===1&&n===area;
  preview.style.cssText=boxStyle(q.r,q.c,q.w,q.h,N,2)+';display:block';
  const cl=showMist?(ok?' ok':''):' neu';
  preview.className='preview'+cl;
  lightTiles(q,cl);
  dim.textContent=`${q.w}×${q.h} = ${area}`;dim.className='dim'+cl;dim.style.display='block';
  const W=wrap.clientWidth,cs=W/N,dw=dim.offsetWidth,dh=dim.offsetHeight;
  let top=q.r*cs-dh-8;if(top<-dh-4)top=(q.r+q.h)*cs+8;
  if(top<0&&q.r*cs<dh+8)top=Math.max(-dh-10,q.r*cs-dh-8);
  let left=(q.c+q.w/2)*cs-dw/2;left=Math.max(0,Math.min(W-dw,left));
  dim.style.left=left+'px';dim.style.top=top+'px';
  updateLoupe(cl,`${q.w}×${q.h} = ${area}`);
}
const loupe=$('loupe'),loupeIn=$('loupeIn');
function updateLoupe(cl,label){
  const N=G.puzzle.size,W=board.clientWidth,cs=W/N;
  if(!drag||cs>=40){loupe.style.display='none';return}
  dim.style.display='none';
  const L=128,Z=Math.min(2.6,Math.max(1.8,46/cs)),cur=drag.cur;
  const px=(cur.c+.5)*cs,py=(cur.r+.5)*cs;
  loupeIn.className=board.className;
  loupeIn.innerHTML=board.innerHTML.replace(/ id="[^"]*"/g,'');
  loupeIn.style.cssText=board.style.cssText+`;inset:auto;left:0;top:0;width:${W}px;height:${W}px;transform-origin:0 0;transform:translate(${L/2-px*Z}px,${L/2-py*Z}px) scale(${Z})`;
  const lc=$('loupeC');const cz=cs*Z-4;
  lc.style.cssText=`left:${(L-cz)/2}px;top:${(L-cz)/2}px;width:${cz}px;height:${cz}px`;
  const lb=$('loupeL');lb.textContent=label;lb.className='lbl'+cl;
  let top=py-L-48,left=px-L/2;
  if(wrap.getBoundingClientRect().top+top<6){top=py-L/2;left=px>W/2?px-L-48:px+48}
  left=Math.max(-8,Math.min(W-L+8,left));
  loupe.style.left=left+'px';loupe.style.top=top+'px';loupe.style.display='block';
}
let litTiles=[],doomedRects=[];
function lightTiles(q,cl){
  clearLit();const N=G.puzzle.size,tiles=$('tileLayer').children;
  for(let a=0;a<q.h;a++)for(let b=0;b<q.w;b++){const t=tiles[(q.r+a)*N+q.c+b];t.className='tile lit'+cl;litTiles.push(t)}
  G.rects.forEach((o,i)=>{if(overlaps(o,q)){const el=rectLayer.children[i];el.classList.add('doomed');doomedRects.push(el)}});
}
function clearLit(){litTiles.forEach(t=>t.className='tile');doomedRects.forEach(el=>el.classList.remove('doomed'));litTiles=[];doomedRects=[]}
function hidePreview(){preview.style.display='none';dim.style.display='none';loupe.style.display='none';clearLit()}

board.addEventListener('pointerdown',e=>{
  if(!G||G.solved||busy||drag)return;
  e.preventDefault();
  const cell=cellAt(e);
  try{board.setPointerCapture(e.pointerId)}catch(_){}
  drag={id:e.pointerId,s:cell,cur:cell,moved:false,occ:A.owner[cell.r*G.puzzle.size+cell.c]};
  if(drag.occ<0)showPreview();
});
board.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  e.preventDefault();
  const cell=cellAt(e,drag.cur);
  if(cell.r===drag.cur.r&&cell.c===drag.cur.c)return;
  drag.cur=cell;
  if(cell.r!==drag.s.r||cell.c!==drag.s.c)drag.moved=true;
  showPreview();
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;hidePreview();
  if(cancel)return;
  if(!d.moved){
    if(d.occ>=0)removeRect(d.occ);
    else placeRect({r:d.s.r,c:d.s.c,w:1,h:1});
  }else{
    const s=d.s,c=d.cur;
    placeRect({r:Math.min(s.r,c.r),c:Math.min(s.c,c.c),w:Math.abs(s.c-c.c)+1,h:Math.abs(s.r-c.r)+1});
  }
}
board.addEventListener('pointerup',e=>endDrag(e,false));
board.addEventListener('pointercancel',e=>endDrag(e,true));
board.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- win & stats ---------- */
function currentStreak(){
  const d=stats.daily||{};if(!d.lastDate)return 0;
  const t=todayKey();
  return(d.lastDate===t||d.lastDate===shiftKey(t,-1))?(d.streak||0):0;
}
function win(){
  pauseTimer();
  G.solved=true;G.solvedTime=G.elapsed;
  const t=G.solvedTime,s=stats[mode]||{solved:0,total:0,best:null};
  const newBest=s.best==null||t<s.best;
  s.solved++;s.total+=t;if(newBest)s.best=t;
  if(mode==='daily'){
    const today=G.dateKey;
    if(s.lastDate!==today){
      s.streak=s.lastDate===shiftKey(today,-1)?(s.streak||0)+1:1;
      s.lastDate=today;s.maxStreak=Math.max(s.maxStreak||0,s.streak);
    }
  }
  stats[mode]=s;store.set(K_STATS,stats);
  saveGame();render();buzz([15,40,15]);
  [...rectLayer.children].forEach((el,i)=>{const q=G.rects[i];el.style.setProperty('--d',((q.r+q.c+(q.w+q.h)/2)*35)+'ms');el.classList.add('wave')});
  setTimeout(()=>{
    const extra=mode==='daily'
      ?`<div class="mini"><div class="k">Streak</div><div class="v">${s.streak} day${s.streak===1?'':'s'}</div></div>`
      :`<div class="mini"><div class="k">Best ${MODES[mode].label}</div><div class="v">${fmtTime(s.best)}</div></div>`;
    showModal(`<h2>Solved!${newBest&&s.solved>1?'<span class="badge">NEW BEST</span>':''}</h2>
      <p class="muted" style="margin:0">${mode==='daily'?'Daily puzzle · '+prettyDate(G.dateKey):MODES[mode].label+' · '+G.puzzle.size+'×'+G.puzzle.size}</p>
      <div class="big">${fmtTime(t)}</div>
      <div class="grid2"><div class="mini"><div class="k">Hints used</div><div class="v">${G.hints}</div></div>${extra}</div>
      <div class="btnrow">${mode==='daily'
        ?`<button class="btn" data-close>Close</button><button class="btn mint" id="winNext">Play Medium</button>`
        :`<button class="btn" data-close>Close</button><button class="btn mint" id="winNext">New Puzzle</button>`}</div>`);
    $('winNext').onclick=()=>{hideModal();if(mode==='daily')loadMode('medium');else newGame()};
  },650);
}

function showStats(){
  const rows=Object.keys(MODES).map(m=>{
    const s=stats[m]||{};
    return `<tr><td>${MODES[m].label}</td><td>${s.solved||0}</td><td>${s.best!=null?fmtTime(s.best):'–'}</td><td>${s.solved?fmtTime(s.total/s.solved):'–'}</td></tr>`;
  }).join('');
  const d=stats.daily||{};
  showModal(`<h2>Stats</h2>
    <div class="grid2"><div class="mini"><div class="k">Daily streak</div><div class="v" style="color:var(--mint)">${currentStreak()}</div></div>
    <div class="mini"><div class="k">Best streak</div><div class="v">${d.maxStreak||0}</div></div></div>
    <table><tr><th>Mode</th><th>Solved</th><th>Best</th><th>Avg</th></tr>${rows}</table>
    <div class="btnrow"><button class="btn mint" data-close>Done</button></div>`);
}

function showHelp(){
  showModal(`<h2>How to play</h2>
    <svg class="ex" viewBox="0 0 150 150">
      <rect x="1" y="1" width="148" height="148" rx="10" fill="#171A1F" stroke="#2E333B"/>
      <rect x="4" y="4" width="68" height="68" rx="6" fill="hsl(160 30% 24%)" stroke="hsl(160 36% 42%)" stroke-width="1.5"/>
      <rect x="78" y="4" width="68" height="31" rx="6" fill="hsl(212 30% 24%)" stroke="hsl(212 36% 42%)" stroke-width="1.5"/>
      <rect x="78" y="41" width="68" height="105" rx="6" fill="hsl(268 30% 24%)" stroke="hsl(268 36% 42%)" stroke-width="1.5"/>
      <rect x="4" y="78" width="68" height="68" rx="6" fill="hsl(32 30% 24%)" stroke="hsl(32 36% 42%)" stroke-width="1.5"/>
      <g font-family="Nunito Sans,sans-serif" font-weight="900" font-size="22" fill="#E6E8EB" text-anchor="middle">
        <text x="56" y="63">4</text><text x="94" y="27">2</text><text x="131" y="101">6</text><text x="19" y="101">4</text></g>
    </svg>
    <ul>
      <li>Split the whole grid into rectangles.</li>
      <li>Each rectangle holds <b>exactly one number</b>, and its area (width × height) must equal that number.</li>
      <li>Every square is used once. No overlaps.</li>
    </ul>
    <p style="margin-top:4px"><b>Drag</b> from corner to corner to draw. The size pops up as you go: <span style="color:var(--mint);font-weight:800">mint</span> means it fits, <span style="color:var(--amber);font-weight:800">amber</span> means it doesn’t. <b>Tap</b> a rectangle to remove it. Drawing over one replaces it.</p>
    <p class="muted">Tip: start with big numbers squeezed against walls, and with numbers that are prime (2, 3, 5, 7…) — they can only be straight lines.</p>
    <div class="btnrow"><button class="btn mint" data-close>Let’s play</button></div>`);
}
$('helpBtn').onclick=showHelp;
$('statsBtn').onclick=showStats;
const PAL_INFO={pastel:['Pastel','Soft and light'],jewel:['Jewel','Rich and bold'],ocean:['Ocean','Mints, teals and blues']};
function showColors(){
  const cur=store.get(K_PAL,'pastel');
  showModal(`<h2>Settings</h2>
    <button class="setrow" id="mistRow"><span><b>Show mistakes</b><small>Amber outlines on wrong rectangles, and mint/amber while you drag</small></span><span class="tog${showMist?' on':''}" id="mistTog"></span></button>
    <button class="setrow" id="neonRow"><span><b>Neon glow</b><small>A soft glow in each rectangle’s color</small></span><span class="tog${neon?' on':''}" id="neonTog"></span></button>
    <div class="sechd">Board colors</div>
    ${Object.keys(PALETTES).map(k=>`<button class="palopt${k===cur?' on':''}" data-pal="${k}"><span><b>${PAL_INFO[k][0]}</b><small>${PAL_INFO[k][1]}</small></span>
      <span class="sw">${PALETTES[k].slice(0,6).map(c=>`<i style="background:${c[0]}"></i>`).join('')}</span></button>`).join('')}
    <div class="btnrow"><button class="btn mint" data-close>Done</button></div>`);
  document.querySelectorAll('.palopt').forEach(b=>b.onclick=()=>{
    store.set(K_PAL,b.dataset.pal);PAL=PALETTES[b.dataset.pal];if(G)render();
    document.querySelectorAll('.palopt').forEach(x=>x.classList.toggle('on',x===b));
  });
  $('neonRow').onclick=()=>{neon=!neon;store.set(K_NEON,neon);$('neonTog').classList.toggle('on',neon);board.classList.toggle('neon',neon)};
  $('mistRow').onclick=()=>{showMist=!showMist;store.set(K_MIST,showMist);$('mistTog').classList.toggle('on',showMist);if(G)render()};
}
$('timeBtn').onclick=()=>setPaused(!paused);
$('resumeBtn').onclick=()=>setPaused(false);
$('palBtn').onclick=showColors;

/* ---------- modal ---------- */
let modalLock=false;
function showModal(html,opt){modalLock=!!(opt&&opt.lock);$('modal').innerHTML=html;$('backdrop').classList.add('show')}
function hideModal(){modalLock=false;$('backdrop').classList.remove('show')}
$('backdrop').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')||(e.target.id==='backdrop'&&!modalLock))hideModal();
});

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pauseTimer();saveGame()}
  else{
    renderModes();
    if(mode==='daily'&&G&&G.dateKey!==todayKey()&&!busy)loadMode('daily');
    else startTimer();
  }
});
window.addEventListener('pagehide',()=>{pauseTimer();saveGame()});


/* ---------- offline ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

/* ---------- boot ---------- */
board.classList.toggle('neon',neon);
renderModes();
loadMode(mode);
if(!store.get(K_SEEN,false)){store.set(K_SEEN,true);setTimeout(()=>{if(!busy)showHelp()},300)}
</script>
</body>
</html>
