<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shikaku">
<meta name="theme-color" content="#07080A">
<title>Shikaku</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080A;--panel:#111317;--panel2:#171A1F;--border:#23272E;--border2:#2E333B;
  --text:#E6E8EB;--muted:#8A9099;--mint:#3CC79A;--amber:#E3A04F;
  --line:rgba(255,255,255,.07);--cell:40px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Nunito Sans',Avenir,'Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{min-height:100dvh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{max-width:640px;margin:0 auto;padding:12px 16px 14px;display:flex;flex-direction:column;gap:12px;
  min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:260px;position:relative}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.3px}
.brand h1 span{color:var(--mint)}
.brand .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.iconbtns{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;font-weight:800;font-size:17px}
.iconbtn:active{background:var(--panel2)}
.iconbtn svg{width:19px;height:19px}

.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4px}
.modes button{background:none;border:0;border-radius:10px;padding:7px 2px 6px;line-height:1.1;color:var(--muted)}
.modes button b{display:block;font-size:13.5px;font-weight:800}
.modes button small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.modes button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.modes button.on small{color:var(--mint);opacity:1}

.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px 12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.stat .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v.mint{color:var(--mint)}

.banner{background:var(--amber);color:#1A1205;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;display:none}
.banner.show{display:block}

.boardWrap{position:relative;align-self:center;aspect-ratio:1;
  width:min(100%,600px,max(260px,calc(100dvh - 380px - env(safe-area-inset-top) - env(safe-area-inset-bottom))))}
.board{position:absolute;inset:0;background-color:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  touch-action:none;cursor:crosshair;--n:5;
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);
  background-size:calc(100% / var(--n)) calc(100% / var(--n));transition:box-shadow .4s}
.board.solved{box-shadow:0 0 0 2px var(--mint),0 0 44px rgba(60,199,154,.28);cursor:default}
.layer{position:absolute;inset:0;pointer-events:none}
.rect{position:absolute;border-radius:7px;background:hsl(var(--h) 30% 24%);border:1.5px solid hsl(var(--h) 36% 42%)}
.rect.bad{background:hsl(var(--h) 16% 17%);border:2px solid var(--amber)}
.rect.hint::after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--mint)}
.rect.pop{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:scale(1);opacity:1}}
.clue{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;
  font-size:calc(var(--cell) * .52);font-variant-numeric:tabular-nums;color:var(--text)}
.clue.done{color:rgba(230,232,235,.78)}
.clue.bad{color:var(--amber)}
.preview{position:absolute;border-radius:7px;border:2px dashed var(--amber);background:rgba(227,160,79,.13);display:none}
.preview.ok{border-color:var(--mint);background:rgba(60,199,154,.16)}
.dim{position:absolute;z-index:5;pointer-events:none;display:none;background:var(--amber);color:#1A1205;font-weight:900;
  font-size:15px;padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.dim.ok{background:var(--mint);color:#04160F}

.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-top:4px}
.ctl{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px 2px 13px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
.ctl svg{width:27px;height:27px}
.ctl span{font-size:13px;font-weight:700;color:var(--muted)}
.ctl:active{transform:scale(.95)}
.ctl:active{background:var(--panel2)}
.ctl:disabled{opacity:.35}
.ctl.primary{border-color:rgba(60,199,154,.45)}
.ctl.primary svg{color:var(--mint)}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:50;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.backdrop.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:420px;max-height:100%;overflow:auto;padding:22px 20px 18px;
  animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 4px;font-size:22px;font-weight:900}
.modal p,.modal li{color:#C4C8CE;font-size:15px;line-height:1.5}
.modal ul{padding-left:20px;margin:8px 0}
.modal .muted{color:var(--muted);font-size:13px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border-radius:14px;padding:13px;font-size:16px;font-weight:800;border:1px solid var(--border2);background:var(--panel2)}
.btn.mint{background:var(--mint);color:#04160F;border-color:var(--mint)}
.btn.amber{background:var(--amber);color:#1A1205;border-color:var(--amber)}
.big{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--mint);line-height:1.05;margin:10px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mini{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.mini .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.mini .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--amber);color:#1A1205;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:right;font-weight:700;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-top:1px solid var(--border);text-align:right;font-weight:800;font-size:15px}
td:first-child{font-weight:700;color:#C4C8CE}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--border2);border-top-color:var(--mint);animation:spin .8s linear infinite;margin:6px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ex{display:block;margin:10px auto 4px;width:150px;height:150px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Shikaku<span>.</span></h1><div class="sub" id="sub">Divide the grid into rectangles</div></div>
    <div class="iconbtns">
      <button class="iconbtn" id="statsBtn" aria-label="Stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-6"/></svg></button>
      <button class="iconbtn" id="helpBtn" aria-label="How to play">?</button>
    </div>
  </header>

  <div class="modes" id="modes"></div>

  <div class="stats">
    <div class="stat"><div class="k">Time</div><div class="v" id="time">0:00</div></div>
    <div class="stat"><div class="k">Filled</div><div class="v" id="prog">0%</div></div>
    <div class="stat"><div class="k">Hints</div><div class="v" id="hints">0</div></div>
  </div>

  <div class="banner" id="banner"></div>
  <div class="stage" id="stage">

  <div class="boardWrap" id="wrap">
    <div class="board" id="board">
      <div class="layer" id="rectLayer" style="z-index:1"></div>
      <div class="layer" id="clueLayer" style="z-index:2"></div>
      <div class="layer" style="z-index:3"><div class="preview" id="preview"></div></div>
    </div>
    <div class="dim" id="dim"></div>
  </div>
  </div>

  <div class="controls">
    <button class="ctl" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
    <button class="ctl" id="redoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>Redo</span></button>
    <button class="ctl" id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg><span>Hint</span></button>
    <button class="ctl" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Reset</span></button>
    <button class="ctl primary" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>

<script>
'use strict';
// ===== GEN-START =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

const MODES={
  easy:  {label:'Easy',  size:5, maxArea:6, strip:4},
  medium:{label:'Medium',size:7, maxArea:9, strip:5},
  hard:  {label:'Hard',  size:10,maxArea:12,strip:5},
  expert:{label:'Expert',size:12,maxArea:16,strip:6},
  daily: {label:'Daily', size:8, maxArea:10,strip:5}
};

// Randomly partition an N×N grid into rectangles (row-major, top-left anchored).
function partition(N,rng,cfg){
  const owner=new Int16Array(N*N).fill(-1),rects=[];
  for(let idx=0;idx<N*N;idx++){
    if(owner[idx]>=0)continue;
    const r=(idx/N)|0,c=idx%N,opts=[];let tot=0,curW=N-c;
    for(let h=1;r+h-1<N;h++){
      const rr=r+h-1;let run=0;
      while(run<curW&&owner[rr*N+c+run]<0)run++;
      curW=run;if(curW===0)break;
      for(let w=1;w<=curW;w++){
        const a=w*h;if(a>cfg.maxArea)break;
        const mn=Math.min(w,h),mx=Math.max(w,h);
        if(mn===1&&mx>cfg.strip)continue;
        if(mn>1&&mx>mn*3)continue;
        const wt=a===1?0.06:1;
        opts.push([w,h,wt]);tot+=wt;
      }
      if(h>=cfg.maxArea)break;
    }
    let x=rng()*tot,ch=opts[opts.length-1];
    for(const o of opts){x-=o[2];if(x<=0){ch=o;break}}
    const w=ch[0],h=ch[1],id=rects.length;
    for(let i=0;i<h;i++)for(let j=0;j<w;j++)owner[(r+i)*N+c+j]=id;
    rects.push({r,c,w,h});
  }
  return rects;
}

// Every rectangle each clue could legally occupy (any shape, not just generator shapes).
function buildCands(N,clues){
  const clueAt=new Int16Array(N*N).fill(-1);clues.forEach((k,i)=>clueAt[k.r*N+k.c]=i);
  const cands=[],cellC=Array.from({length:N*N},()=>[]);
  clues.forEach((k,ci)=>{
    for(let w=1;w<=k.n;w++){
      if(k.n%w)continue;const h=k.n/w;if(w>N||h>N)continue;
      for(let r0=Math.max(0,k.r-h+1);r0<=k.r&&r0+h<=N;r0++)
        for(let c0=Math.max(0,k.c-w+1);c0<=k.c&&c0+w<=N;c0++){
          const cells=[];let ok=true;
          for(let i=0;i<h&&ok;i++)for(let j=0;j<w;j++){
            const id=(r0+i)*N+c0+j;
            if(clueAt[id]>=0&&clueAt[id]!==ci){ok=false;break}
            cells.push(id);
          }
          if(!ok)continue;
          const cid=cands.length;cands.push({clue:ci,r:r0,c:c0,w,h,cells});
          for(const id of cells)cellC[id].push(cid);
        }
    }
  });
  return{cands,cellC};
}

// Exact-cover backtracking; stops once `limit` solutions are found.
function countSolutions(N,clues,limit,nodeLimit){
  limit=limit||2;nodeLimit=nodeLimit||150000;
  const{cands,cellC}=buildCands(N,clues);
  const cov=new Uint8Array(N*N),used=new Uint8Array(clues.length);
  let count=0,nodes=0,aborted=false;
  const valid=cid=>{const k=cands[cid];if(used[k.clue])return false;for(const id of k.cells)if(cov[id])return false;return true};
  (function rec(){
    if(++nodes>nodeLimit){aborted=true;return}
    let best=-1,bestN=1e9;
    for(let i=0;i<N*N;i++){
      if(cov[i])continue;let n=0;
      for(const cid of cellC[i])if(valid(cid)){n++;if(n>=bestN)break}
      if(n===0)return;
      if(n<bestN){bestN=n;best=i;if(n===1)break}
    }
    if(best<0){count++;return}
    for(const cid of cellC[best]){
      if(!valid(cid))continue;const k=cands[cid];
      used[k.clue]=1;for(const id of k.cells)cov[id]=1;
      rec();
      for(const id of k.cells)cov[id]=0;used[k.clue]=0;
      if(count>=limit||aborted)return;
    }
  })();
  return aborted?limit:count;
}

function generate(mode,rng){
  const cfg=MODES[mode],N=cfg.size,maxOnes=Math.ceil(N*N/40);
  for(let attempt=0;attempt<100000;attempt++){
    const rects=partition(N,rng,cfg);
    if(rects.filter(q=>q.w*q.h===1).length>maxOnes)continue;
    for(let p=0;p<8;p++){
      const clues=rects.map(q=>{const a=Math.floor(rng()*q.w*q.h);return{r:q.r+Math.floor(a/q.w),c:q.c+a%q.w,n:q.w*q.h}});
      if(countSolutions(N,clues,2)===1)
        return{size:N,clues,solution:rects.map(q=>({r:q.r,c:q.c,w:q.w,h:q.h}))};
    }
  }
  return null;
}
// ===== GEN-END =====

/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const K_GAMES='shikaku.v1.games',K_STATS='shikaku.v1.stats',K_MODE='shikaku.v1.mode',K_SEEN='shikaku.v1.seenHelp';
let games=store.get(K_GAMES,{})||{};
let stats=store.get(K_STATS,{})||{};
let mode=store.get(K_MODE,'easy');if(!MODES[mode])mode='easy';

/* ---------- state ---------- */
const HUES=[160,212,268,32,96,338,188,52,290,128,8,236];
let G=null,A=null,undoStack=[],redoStack=[],runStart=null,drag=null,popKey=null,busy=false;

const $=id=>document.getElementById(id);
const board=$('board'),rectLayer=$('rectLayer'),clueLayer=$('clueLayer'),preview=$('preview'),dim=$('dim'),wrap=$('wrap');

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const fmtKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>fmtKey(new Date());
function shiftKey(key,days){const[y,m,d]=key.split('-').map(Number);return fmtKey(new Date(y,m-1,d+days))}
function prettyDate(key){const[y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}

/* ---------- time ---------- */
function fmtTime(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}:${pad(m)}:${pad(ss)}`:`${m}:${pad(ss)}`;
}
const elapsedNow=()=>G?G.elapsed+(runStart!=null?Date.now()-runStart:0):0;
function startTimer(){if(G&&!G.solved&&runStart==null&&!document.hidden)runStart=Date.now()}
function pauseTimer(){if(G&&runStart!=null){G.elapsed+=Date.now()-runStart}runStart=null}
setInterval(()=>{$('time').textContent=fmtTime(G&&G.solved?G.solvedTime:elapsedNow())},250);

function saveGame(){
  if(!G)return;
  games[G.mode]=Object.assign({},G,{elapsed:elapsedNow()});
  store.set(K_GAMES,games);
}

/* ---------- mode bar ---------- */
function renderModes(){
  $('modes').innerHTML=Object.keys(MODES).map(m=>{
    const c=MODES[m],sub=m==='daily'?prettyDate(todayKey()):`${c.size}×${c.size}`;
    return `<button data-m="${m}" class="${m===mode?'on':''}"><b>${c.label}</b><small>${sub}</small></button>`;
  }).join('');
}
$('modes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||busy)return;
  if(b.dataset.m!==mode)loadMode(b.dataset.m);
});

function loadMode(m){
  pauseTimer();saveGame();
  mode=m;store.set(K_MODE,mode);renderModes();
  let g=games[m];
  if(g&&m==='daily'&&g.dateKey!==todayKey())g=null;
  if(g&&g.puzzle&&g.puzzle.size===MODES[m].size){
    G=g;undoStack=[];redoStack=[];buildBoard();render();startTimer();
  }else newGame();
}

/* ---------- generation ---------- */
function newGame(){
  if(busy)return;busy=true;pauseTimer();
  showModal(`<div style="text-align:center;padding:10px 0"><div class="spinner"></div>
    <h2 style="font-size:19px">Building a puzzle</h2><p class="muted" style="margin:4px 0 0">Checking it has exactly one solution…</p></div>`,{lock:true});
  setTimeout(()=>{
    const key=todayKey();
    const rng=mode==='daily'?mulberry32(hashStr('shikaku-daily-'+key)):mulberry32((Math.random()*4294967296)>>>0);
    const puzzle=generate(mode,rng);
    G={mode,dateKey:mode==='daily'?key:null,puzzle,rects:[],elapsed:0,hints:0,solved:false,solvedTime:0,colorSeq:0};
    undoStack=[];redoStack=[];
    buildBoard();render();saveGame();
    busy=false;hideModal();startTimer();
  },60);
}

/* ---------- board ---------- */
function pct(v,N){return (v/N*100).toFixed(4)+'%'}
function boxStyle(r,c,w,h,N,inset){
  return `left:calc(${pct(c,N)} + ${inset}px);top:calc(${pct(r,N)} + ${inset}px);`+
         `width:calc(${pct(w,N)} - ${inset*2}px);height:calc(${pct(h,N)} - ${inset*2}px)`;
}
function sizeCells(){if(G)board.style.setProperty('--cell',(board.clientWidth/G.puzzle.size)+'px')}
new ResizeObserver(sizeCells).observe(board);
const stage=$('stage');
function fitBoard(){const w=stage.clientWidth,h=stage.clientHeight;if(w&&h)wrap.style.width=Math.floor(Math.min(w,h,600))+'px'}
new ResizeObserver(fitBoard).observe(stage);

function buildBoard(){
  const N=G.puzzle.size;
  board.style.setProperty('--n',N);
  clueLayer.innerHTML=G.puzzle.clues.map((k,i)=>`<div class="clue" id="clue${i}" style="${boxStyle(k.r,k.c,1,1,N,0)}">${k.n}</div>`).join('');
  sizeCells();
  $('newBtn').querySelector('span').textContent=mode==='daily'?'Today':'New';
  $('sub').textContent=mode==='daily'?`Daily puzzle · ${prettyDate(G.dateKey)}`:`${MODES[mode].label} · ${N}×${N}`;
}

function analyze(){
  const N=G.puzzle.size,owner=new Int16Array(N*N).fill(-1),clueAt=new Int16Array(N*N).fill(-1);
  G.rects.forEach((q,i)=>{for(let a=0;a<q.h;a++)for(let b=0;b<q.w;b++)owner[(q.r+a)*N+q.c+b]=i});
  G.puzzle.clues.forEach((k,i)=>clueAt[k.r*N+k.c]=i);
  const valid=G.rects.map(q=>{
    let cnt=0,n=0;
    for(let a=0;a<q.h;a++)for(let b=0;b<q.w;b++){const ci=clueAt[(q.r+a)*N+q.c+b];if(ci>=0){cnt++;n=G.puzzle.clues[ci].n}}
    return cnt===1&&n===q.w*q.h;
  });
  let covered=0;for(let i=0;i<N*N;i++)if(owner[i]>=0)covered++;
  return{N,owner,clueAt,valid,covered};
}

function render(){
  A=analyze();const{N,owner,valid,covered}=A;
  rectLayer.innerHTML=G.rects.map((q,i)=>{
    const k=`${q.r},${q.c},${q.w},${q.h}`;
    const cls=['rect',valid[i]?'':'bad',q.hint?'hint':'',k===popKey?'pop':''].join(' ');
    return `<div class="${cls}" style="--h:${HUES[q.col%HUES.length]};${boxStyle(q.r,q.c,q.w,q.h,N,2)}"></div>`;
  }).join('');
  popKey=null;
  G.puzzle.clues.forEach((k,i)=>{
    const o=owner[k.r*N+k.c],el=$('clue'+i);
    el.className='clue'+(o<0?'':valid[o]?' done':' bad');
  });
  $('prog').textContent=Math.floor(covered/(N*N)*100)+'%';
  $('prog').className='v'+(G.solved?' mint':'');
  $('hints').textContent=G.hints;
  const bad=valid.filter(v=>!v).length,banner=$('banner');
  if(!G.solved&&covered===N*N&&bad){
    banner.textContent=`The grid is full, but ${bad} rectangle${bad>1?'s aren’t':' isn’t'} right yet.`;banner.classList.add('show');
  }else banner.classList.remove('show');
  board.classList.toggle('solved',G.solved);
  $('undoBtn').disabled=G.solved||!undoStack.length;
  $('redoBtn').disabled=G.solved||!redoStack.length;
  $('hintBtn').disabled=G.solved;
  $('resetBtn').disabled=G.solved||!G.rects.length;
  $('newBtn').disabled=mode==='daily'&&!G.solved?false:false;
  if(!G.solved&&covered===N*N&&!bad)win();
}

/* ---------- edits ---------- */
const snap=()=>JSON.stringify(G.rects);
function commit(){undoStack.push(snap());if(undoStack.length>300)undoStack.shift();redoStack=[]}

function pickColor(q){
  const{N,owner}=A,near=new Set();
  const look=(r,c)=>{if(r<0||c<0||r>=N||c>=N)return;const o=owner[r*N+c];if(o>=0&&!overlaps(G.rects[o],q))near.add(G.rects[o].col%HUES.length)};
  for(let i=0;i<q.w;i++){look(q.r-1,q.c+i);look(q.r+q.h,q.c+i)}
  for(let i=0;i<q.h;i++){look(q.r+i,q.c-1);look(q.r+i,q.c+q.w)}
  for(let t=0;t<HUES.length;t++){const c=(G.colorSeq+t)%HUES.length;if(!near.has(c)){G.colorSeq=c+1;return c}}
  return G.colorSeq++%HUES.length;
}
const overlaps=(a,b)=>a.r<b.r+b.h&&b.r<a.r+a.h&&a.c<b.c+b.w&&b.c<a.c+a.w;

function placeRect(q,hint){
  commit();
  q.col=pickColor(q);if(hint)q.hint=true;
  G.rects=G.rects.filter(o=>!overlaps(o,q));
  G.rects.push(q);popKey=`${q.r},${q.c},${q.w},${q.h}`;
  render();saveGame();
}
function removeRect(i){commit();G.rects.splice(i,1);render();saveGame()}

$('undoBtn').onclick=()=>{if(!undoStack.length||G.solved)return;redoStack.push(snap());G.rects=JSON.parse(undoStack.pop());render();saveGame()};
$('redoBtn').onclick=()=>{if(!redoStack.length||G.solved)return;undoStack.push(snap());G.rects=JSON.parse(redoStack.pop());render();saveGame()};
$('hintBtn').onclick=()=>{
  if(G.solved)return;
  const has=s=>G.rects.some((q,i)=>A.valid[i]&&q.r===s.r&&q.c===s.c&&q.w===s.w&&q.h===s.h);
  const missing=G.puzzle.solution.filter(s=>!has(s));if(!missing.length)return;
  const wrong=missing.filter(s=>G.rects.some(q=>overlaps(q,s)));
  const pool=wrong.length?wrong:missing,s=pool[Math.floor(Math.random()*pool.length)];
  G.hints++;placeRect({r:s.r,c:s.c,w:s.w,h:s.h},true);
};
$('resetBtn').onclick=()=>{
  if(G.solved||!G.rects.length)return;
  showModal(`<h2>Reset this puzzle?</h2><p>All your rectangles will be cleared. The timer keeps running, and you can undo this.</p>
    <div class="btnrow"><button class="btn" data-close>Cancel</button><button class="btn amber" id="doReset">Reset</button></div>`);
  $('doReset').onclick=()=>{commit();G.rects=[];hideModal();render();saveGame()};
};
$('newBtn').onclick=()=>{
  if(busy)return;
  if(mode==='daily'){
    showModal(`<h2>Daily puzzle</h2><p>${G.solved?'You’ve solved today’s puzzle.':'Everyone gets the same daily puzzle.'} A new one arrives at midnight.</p>
      <div class="btnrow"><button class="btn mint" data-close>Got it</button></div>`);return;
  }
  if(!G.solved&&G.rects.length){
    showModal(`<h2>Start a new puzzle?</h2><p>Your progress on this one will be lost.</p>
      <div class="btnrow"><button class="btn" data-close>Keep playing</button><button class="btn mint" id="doNew">New puzzle</button></div>`);
    $('doNew').onclick=()=>{hideModal();newGame()};
  }else newGame();
};

/* ---------- pointer input ---------- */
function cellAt(e){
  const b=board.getBoundingClientRect(),N=G.puzzle.size;
  const x=(e.clientX-b.left-1)/(b.width-2),y=(e.clientY-b.top-1)/(b.height-2);
  return{r:Math.min(N-1,Math.max(0,Math.floor(y*N))),c:Math.min(N-1,Math.max(0,Math.floor(x*N)))};
}
function dragRect(){
  const s=drag.s,e=drag.cur;
  return{r:Math.min(s.r,e.r),c:Math.min(s.c,e.c),w:Math.abs(s.c-e.c)+1,h:Math.abs(s.r-e.r)+1};
}
function showPreview(){
  const q=dragRect(),N=G.puzzle.size,area=q.w*q.h;
  let cnt=0,n=0;
  for(let a=0;a<q.h;a++)for(let b=0;b<q.w;b++){const ci=A.clueAt[(q.r+a)*N+q.c+b];if(ci>=0){cnt++;n=G.puzzle.clues[ci].n}}
  const ok=cnt===1&&n===area;
  preview.style.cssText=boxStyle(q.r,q.c,q.w,q.h,N,2)+';display:block';
  preview.className='preview'+(ok?' ok':'');
  dim.textContent=`${q.w}×${q.h} = ${area}`;dim.className='dim'+(ok?' ok':'');dim.style.display='block';
  const W=wrap.clientWidth,cs=W/N,dw=dim.offsetWidth,dh=dim.offsetHeight;
  let top=q.r*cs-dh-8;if(top<-dh-4)top=(q.r+q.h)*cs+8;
  if(top<0&&q.r*cs<dh+8)top=Math.max(-dh-10,q.r*cs-dh-8);
  let left=(q.c+q.w/2)*cs-dw/2;left=Math.max(0,Math.min(W-dw,left));
  dim.style.left=left+'px';dim.style.top=top+'px';
}
function hidePreview(){preview.style.display='none';dim.style.display='none'}

board.addEventListener('pointerdown',e=>{
  if(!G||G.solved||busy||drag)return;
  e.preventDefault();
  const cell=cellAt(e);
  try{board.setPointerCapture(e.pointerId)}catch(_){}
  drag={id:e.pointerId,s:cell,cur:cell,moved:false,occ:A.owner[cell.r*G.puzzle.size+cell.c]};
  if(drag.occ<0)showPreview();
});
board.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  e.preventDefault();
  const cell=cellAt(e);
  if(cell.r===drag.cur.r&&cell.c===drag.cur.c)return;
  drag.cur=cell;
  if(cell.r!==drag.s.r||cell.c!==drag.s.c)drag.moved=true;
  showPreview();
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;hidePreview();
  if(cancel)return;
  if(!d.moved){
    if(d.occ>=0)removeRect(d.occ);
    else placeRect({r:d.s.r,c:d.s.c,w:1,h:1});
  }else{
    const s=d.s,c=d.cur;
    placeRect({r:Math.min(s.r,c.r),c:Math.min(s.c,c.c),w:Math.abs(s.c-c.c)+1,h:Math.abs(s.r-c.r)+1});
  }
}
board.addEventListener('pointerup',e=>endDrag(e,false));
board.addEventListener('pointercancel',e=>endDrag(e,true));
board.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- win & stats ---------- */
function currentStreak(){
  const d=stats.daily||{};if(!d.lastDate)return 0;
  const t=todayKey();
  return(d.lastDate===t||d.lastDate===shiftKey(t,-1))?(d.streak||0):0;
}
function win(){
  pauseTimer();
  G.solved=true;G.solvedTime=G.elapsed;
  const t=G.solvedTime,s=stats[mode]||{solved:0,total:0,best:null};
  const newBest=s.best==null||t<s.best;
  s.solved++;s.total+=t;if(newBest)s.best=t;
  if(mode==='daily'){
    const today=G.dateKey;
    if(s.lastDate!==today){
      s.streak=s.lastDate===shiftKey(today,-1)?(s.streak||0)+1:1;
      s.lastDate=today;s.maxStreak=Math.max(s.maxStreak||0,s.streak);
    }
  }
  stats[mode]=s;store.set(K_STATS,stats);
  saveGame();render();
  setTimeout(()=>{
    const extra=mode==='daily'
      ?`<div class="mini"><div class="k">Streak</div><div class="v">${s.streak} day${s.streak===1?'':'s'}</div></div>`
      :`<div class="mini"><div class="k">Best ${MODES[mode].label}</div><div class="v">${fmtTime(s.best)}</div></div>`;
    showModal(`<h2>Solved!${newBest&&s.solved>1?'<span class="badge">NEW BEST</span>':''}</h2>
      <p class="muted" style="margin:0">${mode==='daily'?'Daily puzzle · '+prettyDate(G.dateKey):MODES[mode].label+' · '+G.puzzle.size+'×'+G.puzzle.size}</p>
      <div class="big">${fmtTime(t)}</div>
      <div class="grid2"><div class="mini"><div class="k">Hints used</div><div class="v">${G.hints}</div></div>${extra}</div>
      <div class="btnrow">${mode==='daily'
        ?`<button class="btn" data-close>Close</button><button class="btn mint" id="winNext">Play Medium</button>`
        :`<button class="btn" data-close>Close</button><button class="btn mint" id="winNext">New Puzzle</button>`}</div>`);
    $('winNext').onclick=()=>{hideModal();if(mode==='daily')loadMode('medium');else newGame()};
  },650);
}

function showStats(){
  const rows=Object.keys(MODES).map(m=>{
    const s=stats[m]||{};
    return `<tr><td>${MODES[m].label}</td><td>${s.solved||0}</td><td>${s.best!=null?fmtTime(s.best):'–'}</td><td>${s.solved?fmtTime(s.total/s.solved):'–'}</td></tr>`;
  }).join('');
  const d=stats.daily||{};
  showModal(`<h2>Stats</h2>
    <div class="grid2"><div class="mini"><div class="k">Daily streak</div><div class="v" style="color:var(--mint)">${currentStreak()}</div></div>
    <div class="mini"><div class="k">Best streak</div><div class="v">${d.maxStreak||0}</div></div></div>
    <table><tr><th>Mode</th><th>Solved</th><th>Best</th><th>Avg</th></tr>${rows}</table>
    <div class="btnrow"><button class="btn mint" data-close>Done</button></div>`);
}

function showHelp(){
  showModal(`<h2>How to play</h2>
    <svg class="ex" viewBox="0 0 150 150">
      <rect x="1" y="1" width="148" height="148" rx="10" fill="#171A1F" stroke="#2E333B"/>
      <rect x="4" y="4" width="68" height="68" rx="6" fill="hsl(160 30% 24%)" stroke="hsl(160 36% 42%)" stroke-width="1.5"/>
      <rect x="78" y="4" width="68" height="31" rx="6" fill="hsl(212 30% 24%)" stroke="hsl(212 36% 42%)" stroke-width="1.5"/>
      <rect x="78" y="41" width="68" height="105" rx="6" fill="hsl(268 30% 24%)" stroke="hsl(268 36% 42%)" stroke-width="1.5"/>
      <rect x="4" y="78" width="68" height="68" rx="6" fill="hsl(32 30% 24%)" stroke="hsl(32 36% 42%)" stroke-width="1.5"/>
      <g font-family="Nunito Sans,sans-serif" font-weight="900" font-size="22" fill="#E6E8EB" text-anchor="middle">
        <text x="56" y="63">4</text><text x="94" y="27">2</text><text x="131" y="101">6</text><text x="19" y="101">4</text></g>
    </svg>
    <ul>
      <li>Split the whole grid into rectangles.</li>
      <li>Each rectangle holds <b>exactly one number</b>, and its area (width × height) must equal that number.</li>
      <li>Every square is used once. No overlaps.</li>
    </ul>
    <p style="margin-top:4px"><b>Drag</b> from corner to corner to draw. The size pops up as you go: <span style="color:var(--mint);font-weight:800">mint</span> means it fits, <span style="color:var(--amber);font-weight:800">amber</span> means it doesn’t. <b>Tap</b> a rectangle to remove it. Drawing over one replaces it.</p>
    <p class="muted">Tip: start with big numbers squeezed against walls, and with numbers that are prime (2, 3, 5, 7…) — they can only be straight lines.</p>
    <div class="btnrow"><button class="btn mint" data-close>Let’s play</button></div>`);
}
$('helpBtn').onclick=showHelp;
$('statsBtn').onclick=showStats;

/* ---------- modal ---------- */
let modalLock=false;
function showModal(html,opt){modalLock=!!(opt&&opt.lock);$('modal').innerHTML=html;$('backdrop').classList.add('show')}
function hideModal(){modalLock=false;$('backdrop').classList.remove('show')}
$('backdrop').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')||(e.target.id==='backdrop'&&!modalLock))hideModal();
});

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pauseTimer();saveGame()}
  else{
    renderModes();
    if(mode==='daily'&&G&&G.dateKey!==todayKey()&&!busy)loadMode('daily');
    else startTimer();
  }
});
window.addEventListener('pagehide',()=>{pauseTimer();saveGame()});


/* ---------- boot ---------- */
renderModes();
loadMode(mode);
if(!store.get(K_SEEN,false)){store.set(K_SEEN,true);setTimeout(()=>{if(!busy)showHelp()},300)}
</script>
</body>
</html>
